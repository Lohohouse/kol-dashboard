<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KOL TikTok Dashboard - LOHO House</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
<style>
/* ===== LOHO Design System ===== */
:root{
  --brand:#0E4D8B; --brand2:#1B74C4; --brand-d:#0A3A6B;
  --grad:linear-gradient(120deg,var(--brand),var(--brand2));
  --grad-side:linear-gradient(165deg,#0A3A6B,#0E4D8B 58%,#1565ac);
  --ink:#15263b; --ink-2:#111827; --muted:#647489; --muted-2:#6b7280;
  --bg:#eef2f7; --surface:#fff; --surface-alt:#fafcfe;
  --line:#e7ecf3; --line2:#d7dfea;
  --green:#138a5e;--greenbg:#e7f6ee;--green-txt:#1e8e4e;
  --amber:#9a6a00;--amberbg:#fdf2d6;--amber-txt:#b9770e;
  --red:#c2362b;--redbg:#fdeae7;--red-txt:#c0392b;
  --info:#0E4D8B;--infobg:#e9f1fb;
  --grey:#9aa6b6;--gold:#b9770e;
  --sh:0 1px 2px rgba(16,30,54,.05),0 4px 14px rgba(16,30,54,.05);
  --shlg:0 12px 34px rgba(16,30,54,.13);
  --sh-brand:0 3px 10px rgba(14,77,139,.25);
  --r:13px;--rs:8px;--r-pill:999px;
  --font:"Be Vietnam Pro","Segoe UI",Roboto,Arial,sans-serif;
  --fs:13.5px;--fs-sm:12.5px;--fs-xs:11.5px;
  --side-w:210px;--t:.15s;
  /* legacy aliases để giữ tương thích */
  --primary:var(--brand);--accent:var(--brand2);--text:var(--ink);--border:var(--line);--card:var(--surface);--shadow:var(--sh);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-size:var(--fs);font-family:var(--font);-webkit-font-smoothing:antialiased;line-height:1.45}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.2px}

/* App layout */
.app{display:flex;min-height:100vh}
.side{width:var(--side-w);flex-shrink:0;background:var(--grad-side);color:#fff;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;box-shadow:2px 0 16px rgba(10,58,107,.25);z-index:10}
.side-top{padding:16px 14px 12px;border-bottom:1px solid rgba(255,255,255,.13)}
.logo{font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px;letter-spacing:.3px}
.logo-mark{width:22px;height:22px;border-radius:6px;background:rgba(255,255,255,.2);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.5);flex-shrink:0}
.logo-sub{font-size:11px;opacity:.78;margin-top:4px}
.nav{flex:1;display:flex;flex-direction:column;gap:2px;padding:8px 10px;overflow:auto}
.navitem{display:flex;align-items:center;gap:10px;border:none;background:none;color:rgba(255,255,255,.85);padding:10px 12px;border-radius:9px;cursor:pointer;font-size:13px;font-family:inherit;text-align:left;transition:var(--t);width:100%}
.navitem i{font-size:18px;width:20px;text-align:center;flex-shrink:0}
.navitem span{display:flex;flex-direction:column;line-height:1.15}
.navitem small{font-size:9.5px;opacity:.68}
.navitem:hover{background:rgba(255,255,255,.1);color:#fff}
.navitem.on{background:rgba(255,255,255,.17);color:#fff;font-weight:600;box-shadow:inset 3px 0 0 #fff}
.side-role{padding:10px 12px;border-top:1px solid rgba(255,255,255,.13);display:flex;align-items:center;gap:7px;font-size:11.5px;color:rgba(255,255,255,.85)}
.side-role i{font-size:15px}
.side-dot{width:8px;height:8px;border-radius:50%;background:#22c55e;flex-shrink:0;box-shadow:0 0 0 3px rgba(34,197,94,.2)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.wrap{padding:18px 22px;width:100%;max-width:none}

/* Header row */
.head-row{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:8px}
.h{font-size:20px;font-weight:700;letter-spacing:-.3px;color:var(--ink)}
.h .zh{font-size:13px;color:#334155;font-weight:600;margin-right:8px}
.sub{font-size:var(--fs-xs);color:var(--muted)}

/* Filter bar */
.bar{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;margin:14px 0 16px;box-shadow:var(--sh);display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.bar .label{font-size:var(--fs-xs);color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.bar .sp{flex:1}
.status-pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{padding:6px 13px;border-radius:var(--r-pill);border:1px solid var(--line2);background:#fff;font-size:var(--fs-xs);cursor:pointer;user-select:none;font-weight:600;color:var(--muted);transition:var(--t)}
.pill:hover{border-color:var(--brand2);color:var(--brand)}
.pill.active{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 2px 6px rgba(14,77,139,.22)}
.range-inputs{display:flex;gap:6px;align-items:center;color:var(--muted)}
input,select,textarea{padding:7px 10px;border:1px solid var(--line2);border-radius:var(--rs);font-size:var(--fs-sm);background:#fff;color:var(--ink);font-family:inherit;transition:var(--t)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand2);box-shadow:0 0 0 3px rgba(27,116,196,.14)}

button.btn,.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 12px;border:1px solid var(--line2);background:#fff;border-radius:var(--rs);cursor:pointer;font-size:var(--fs-sm);font-weight:500;font-family:inherit;color:var(--ink);transition:var(--t);line-height:1.3}
.btn:hover{background:#f6f9fc;border-color:var(--brand2);box-shadow:var(--sh)}
.btn.pri{background:var(--grad);color:#fff;border:none;box-shadow:var(--sh-brand)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.sm{padding:4px 9px;font-size:11.5px}

/* KPI */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--sh);position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(var(--brand),var(--brand2))}
.kpi.ok::before{background:var(--green)}.kpi.warn::before{background:var(--amber)}.kpi.red::before{background:var(--red)}
.kpi .lab{font-size:var(--fs-xs);color:var(--muted);font-weight:500;margin-bottom:4px}
.kpi .val{font-size:22px;font-weight:700;color:var(--brand);letter-spacing:-.4px}
.kpi .delta{font-size:11px;margin-top:4px;font-weight:600}
.kpi .delta.up{color:var(--green-txt)}
.kpi .delta.down{color:var(--red-txt)}

/* Panel = Card */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:14px;box-shadow:var(--sh)}
.panel h2{font-size:14px;margin-bottom:14px;color:var(--brand);border-bottom:1px solid var(--line);padding-bottom:9px;font-weight:700}
.panel h2 .zh{font-weight:500;opacity:.75;margin-right:6px;color:#334155;font-size:12px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:900px){.grid-2{grid-template-columns:1fr}}
.chart-wrap{position:relative;height:300px}
.chart-wrap.tall{height:420px}

/* Table */
table{width:100%;border-collapse:separate;border-spacing:0;font-size:var(--fs-sm);background:var(--surface)}
th,td{padding:9px 11px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
thead th{background:var(--grad);color:#fff;font-weight:600;font-size:var(--fs-xs);border-bottom:none;white-space:nowrap;line-height:1.25}
th .zh{display:block;font-size:9px;color:rgba(255,255,255,.95);font-weight:500}
tbody tr:nth-child(even){background:var(--surface-alt)}
tbody tr:hover{background:var(--infobg)}
tfoot td{font-weight:600;background:#f3f7fc;border-top:2px solid var(--line2)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}

/* Badge */
.badge{display:inline-block;padding:2px 9px;border-radius:var(--r-pill);font-size:10.5px;font-weight:600;line-height:1.5;white-space:nowrap}
.badge-green{background:var(--greenbg);color:var(--green-txt)}
.badge-red{background:var(--redbg);color:var(--red-txt)}
.badge-gold{background:var(--amberbg);color:var(--gold)}
.badge-gray{background:#eef1f5;color:#5b6b80}

/* Pager */
.pager{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;margin-top:14px;align-items:center}
.pg-btn{min-width:32px;height:32px;padding:0 8px;border:1px solid var(--line2);background:#fff;border-radius:var(--rs);cursor:pointer;font-size:12.5px;font-weight:600;color:var(--ink);font-family:inherit;transition:var(--t)}
.pg-btn:hover:not(:disabled):not(.active){background:#f6f9fc;border-color:var(--brand2)}
.pg-btn.active{background:var(--grad);color:#fff;border-color:transparent}
.pg-btn:disabled{opacity:.4;cursor:not-allowed}
.pg-ellipsis{padding:0 4px;color:var(--muted)}
.pg-info{font-size:11.5px;color:var(--muted);margin-left:8px}

.footer{text-align:center;color:var(--muted);font-size:11.5px;margin-top:20px;padding:14px;border-top:1px solid var(--line)}

/* Responsive */
@media(max-width:900px){
  .app{flex-direction:column}
  .side{width:100%;height:auto;position:relative;flex-direction:column}
  .nav{flex-direction:row;flex-wrap:nowrap;overflow-x:auto}
  .navitem{width:auto;white-space:nowrap;flex-shrink:0}
  .navitem small{display:none}
  .wrap{padding:14px 16px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="side-top">
      <div class="logo"><span class="logo-mark"></span>LOHO House</div>
      <div class="logo-sub">KOL TikTok Dashboard</div>
    </div>
    <nav class="nav" id="tabs"></nav>
    <div class="side-role"><span class="side-dot"></span>Cập nhật: <span id="lastUpdate">__LAST_UPDATE__</span></div>
  </aside>

  <main class="main">
    <div class="wrap">
      <div class="head-row">
        <div>
          <div class="h"><span class="zh">達人 TikTok 營收儀表板</span>Dashboard Doanh Thu KOL TikTok</div>
          <div class="sub">Loho House · Nguồn: Google Sheets KOL_TikTok_Database_PerMonth</div>
        </div>
      </div>

      <div class="bar">
        <span class="label">🏷️ Trạng thái:</span>
        <div class="status-pills" id="statusPills"></div>
        <span class="sp"></span>
        <span class="label">📅 Khoảng ngày:</span>
        <div class="range-inputs">
          <input type="date" id="dateFrom"> – <input type="date" id="dateTo">
        </div>
        <button class="btn" onclick="resetFilters()"><i class="ti ti-refresh"></i>Reset</button>
      </div>

      <div id="content"></div>

      <div class="footer">Loho House © 2026</div>
    </div>
  </main>
</div>

<script>
const RAW = "__DATA__";
const MONTHS = "__MONTHS__";
const STATUSES = [...new Set(RAW.map(o=>o.status).filter(Boolean))];

const fmt = n => Math.round(n).toLocaleString('vi-VN');
const fmtK = n => {
  if(Math.abs(n)>=1e9) return (n/1e9).toFixed(2)+' tỷ';
  if(Math.abs(n)>=1e6) return (n/1e6).toFixed(1)+' tr';
  if(Math.abs(n)>=1e3) return (n/1e3).toFixed(0)+'k';
  return Math.round(n).toString();
};
const fmtPct = n => (n*100).toFixed(1)+'%';

let state = {
  tab: 'overview',
  statuses: new Set(['Đã quyết toán']),
  dateFrom: null, dateTo: null,
  ctFilter: '',
  selectedMonth: MONTHS[MONTHS.length-1],
  kolMomFrom: null, kolMomTo: null,
  reportCmpFrom: null, reportCmpTo: null,
  reportCurFrom: null, reportCurTo: null,
  charts: {}
};

function buildTabs(){
  const tabs = [
    {id:'overview', icon:'ti-layout-dashboard', vi:'Tổng Quan', zh:'總覽'},
    {id:'month',    icon:'ti-calendar-month',   vi:'Theo Tháng', zh:'月份'},
    {id:'lookup',   icon:'ti-search',           vi:'Tra Cứu Ngày', zh:'查詢'},
    {id:'kols',     icon:'ti-users',            vi:'KOL', zh:'達人'},
    {id:'report',   icon:'ti-chart-bar',        vi:'Báo Cáo', zh:'報告'}
  ];
  document.getElementById('tabs').innerHTML = tabs.map(t =>
    '<button class="navitem '+(state.tab===t.id?'on':'')+'" data-tab="'+t.id+'"><i class="ti '+t.icon+'"></i><span>'+t.vi+'<small>'+t.zh+'</small></span></button>'
  ).join('');
  document.querySelectorAll('.navitem').forEach(el => {
    el.onclick = () => { state.tab = el.dataset.tab; buildTabs(); render(); };
  });
}

function buildStatusPills(){
  document.getElementById('statusPills').innerHTML = STATUSES.map(s =>
    '<div class="pill '+(state.statuses.has(s)?'active':'')+'" data-s="'+s+'">'+s+'</div>'
  ).join('');
  document.querySelectorAll('.pill').forEach(el => {
    el.onclick = () => {
      const s = el.dataset.s;
      if(state.statuses.has(s)) state.statuses.delete(s); else state.statuses.add(s);
      buildStatusPills(); render();
    };
  });
}

function initDateRange(){
  const dates = RAW.map(o=>o.date).filter(Boolean).sort();
  if(dates.length){
    document.getElementById('dateFrom').value = dates[0];
    document.getElementById('dateTo').value = dates[dates.length-1];
    state.dateFrom = dates[0]; state.dateTo = dates[dates.length-1];
  }
}

function resetFilters(){
  state.statuses = new Set(['Đã quyết toán']);
  state.ctFilter = '';
  buildStatusPills();
  initDateRange();
  render();
}

function applyFilters(data, ignoreStatus){
  return data.filter(o => {
    if(!ignoreStatus && state.statuses.size>0 && !state.statuses.has(o.status)) return false;
    if(state.dateFrom && o.date && o.date < state.dateFrom) return false;
    if(state.dateTo && o.date && o.date > state.dateTo) return false;
    return true;
  });
}

function aggSum(arr){
  return {
    orders: arr.length,
    qty: arr.reduce((s,o)=>s+o.qty,0),
    gmv: arr.reduce((s,o)=>s+o.payment,0),
    com: arr.reduce((s,o)=>s+o.com,0),
    kols: new Set(arr.map(o=>o.kol)).size,
  };
}
function aggBy(arr, keyFn){
  const m = {};
  arr.forEach(o => {
    const k = keyFn(o);
    if(!m[k]) m[k] = {key:k, orders:0, qty:0, gmv:0, com:0};
    m[k].orders++; m[k].qty+=o.qty; m[k].gmv+=o.payment; m[k].com+=o.com;
  });
  return Object.values(m);
}

// Tìm SP bán chạy nhất (theo GMV) cho 1 KOL + AOV của SP đó
function topProductForKol(allData, kolName){
  const prods = {};
  allData.forEach(o => {
    if(o.kol !== kolName) return;
    const k = groupProduct(o.product);
    if(!prods[k]) prods[k] = {name:k, orders:0, qty:0, gmv:0};
    prods[k].orders++;
    prods[k].qty += o.qty;
    prods[k].gmv += o.payment;
  });
  const arr = Object.values(prods);
  if(!arr.length) return null;
  arr.sort((a,b)=>b.gmv-a.gmv);
  const top = arr[0];
  return {
    name: top.name,
    orders: top.orders,
    qty: top.qty,
    gmv: top.gmv,
    aov: top.orders ? top.gmv/top.orders : 0
  };
}

// Gom sản phẩm theo nhóm Loho
function groupProduct(name){
  if(!name) return '(trống)';
  const low = name.toLowerCase();
  if(low.includes('combo') && (low.includes('sàn nhựa giả gỗ') || low.includes('sàn nhựa'))) return 'Combo sàn dán (5m² + 1m²)';
  if(low.includes('sơn tường tone') && low.includes('1kg')) return 'Sơn tường 1kg (tất cả tone)';
  return name;
}

function kpiCard(lab, val, delta){
  let d = '';
  if(delta !== undefined && delta !== null){
    const arrow = delta>=0?'▲':'▼';
    const cls = delta>=0?'up':'down';
    d = '<div class="delta '+cls+'">'+arrow+' '+Math.abs(delta*100).toFixed(1)+'% vs trước</div>';
  }
  return '<div class="kpi"><div class="lab">'+lab+'</div><div class="val">'+val+'</div>'+d+'</div>';
}

function destroyChart(name){
  if(state.charts[name]){ state.charts[name].destroy(); delete state.charts[name]; }
}

function mkChart(id, name, cfg){
  destroyChart(name);
  const el = document.getElementById(id);
  if(!el) return;
  state.charts[name] = new Chart(el, cfg);
}

// Phân trang bảng: hiện pageSize dòng/trang, có nút số trang 1-2-3-...N
function paginateTable(tableId, navId, pageSize){
  const table = document.getElementById(tableId);
  const nav = document.getElementById(navId);
  if(!table || !nav) return;
  const rows = Array.from(table.querySelectorAll('tbody tr'));
  const total = rows.length;
  const totalPages = Math.ceil(total / pageSize);
  let cur = 1;

  function pageList(){
    // Trả về list trang hiển thị, dùng 0 cho dấu "..."
    if(totalPages <= 7) return Array.from({length:totalPages}, (_,i)=>i+1);
    const list = [1];
    let lo = Math.max(2, cur-1), hi = Math.min(totalPages-1, cur+1);
    if(lo > 2) list.push(0);
    for(let p=lo; p<=hi; p++) list.push(p);
    if(hi < totalPages-1) list.push(0);
    list.push(totalPages);
    return list;
  }

  function show(page){
    cur = Math.max(1, Math.min(totalPages, page));
    rows.forEach((r,i)=>{
      r.style.display = (i >= (cur-1)*pageSize && i < cur*pageSize) ? '' : 'none';
    });
    let h = '<button class="pg-btn" '+(cur===1?'disabled':'')+' data-pg="'+(cur-1)+'">‹</button>';
    pageList().forEach(p=>{
      if(p===0){ h += '<span class="pg-ellipsis">…</span>'; }
      else { h += '<button class="pg-btn '+(p===cur?'active':'')+'" data-pg="'+p+'">'+p+'</button>'; }
    });
    h += '<button class="pg-btn" '+(cur===totalPages?'disabled':'')+' data-pg="'+(cur+1)+'">›</button>';
    const from = total ? (cur-1)*pageSize+1 : 0;
    const to = Math.min(cur*pageSize, total);
    h += '<span class="pg-info">'+from+'–'+to+' / '+total+'</span>';
    nav.innerHTML = h;
    nav.querySelectorAll('.pg-btn').forEach(b=>{
      b.onclick = ()=>{ if(!b.disabled) show(parseInt(b.dataset.pg)); };
    });
  }
  if(totalPages <= 1){ nav.innerHTML=''; return; }
  show(1);
}

function escHtml(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// === OVERVIEW ===
function renderOverview(){
  const data = applyFilters(RAW);
  const totals = aggSum(data);
  const aov = totals.orders ? totals.gmv/totals.orders : 0;
  const comRate = totals.gmv ? totals.com/totals.gmv : 0;

  let html = '<div class="kpi-grid">';
  html += kpiCard('GMV 總營收','<span style="font-size:18px">'+fmt(totals.gmv)+'đ</span>');
  html += kpiCard('Số đơn 訂單', fmt(totals.orders));
  html += kpiCard('Hoa hồng 佣金','<span style="font-size:18px">'+fmt(totals.com)+'đ</span>');
  html += kpiCard('AOV 客單價','<span style="font-size:16px">'+fmt(aov)+'đ</span>');
  html += kpiCard('% HH/GMV', fmtPct(comRate));
  html += kpiCard('KOL 達人', fmt(totals.kols));
  html += '</div>';

  // ① Bảng chi tiết tăng trưởng - có filter loại nội dung
  const ctList = [...new Set(RAW.map(o=>o.ct).filter(Boolean))];
  let ctOpts = '<option value="">Tất cả / 全部</option>';
  ctList.forEach(c => {
    ctOpts += '<option value="'+escHtml(c)+'"'+(state.ctFilter===c?' selected':'')+'>'+escHtml(c)+'</option>';
  });

  html += '<div class="panel"><h2><span class="zh">① 月度成長明細</span>Chi tiết tăng trưởng từng tháng</h2>';
  html += '<div style="display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap">';
  html += '<span style="font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px">🎬 Loại nội dung 內容類型:</span>';
  html += '<select id="ctFilterSel">'+ctOpts+'</select>';
  html += '</div>';

  const dataForTable = state.ctFilter ? data.filter(o=>o.ct===state.ctFilter) : data;
  const byMonth = aggBy(dataForTable, o => o.month).sort((a,b)=>a.key-b.key);

      const po = (r.orders-prev.orders)/prev.orders;
      momOrd = '<span class="badge badge-'+(po>=0?'green':'red')+'">'+(po>=0?'▲':'▼')+' '+Math.abs(po*100).toFixed(1)+'%</span>';
    }
    prev = r;
    html += '<tr><td><strong>T'+r.key+'</strong></td><td class="num">'+fmt(r.gmv)+'</td><td class="num">'+fmt(r.orders)+'</td><td class="num">'+fmt(r.qty)+'</td><td class="num">'+fmt(aov2)+'</td><td class="num">'+fmt(r.com)+'</td><td class="num">'+momGmv+'</td><td class="num">'+momOrd+'</td></tr>';

    const rank = i<3 ? '<span class="badge badge-gold">#'+(i+1)+'</span>' : (i+1);
    const topProd = topProductForKol(data, r.key);

function renderMonth(m){

  html += '<table><thead><tr><th>#</th><th>KOL</th><th class="num">Đơn</th><th class="num">SL</th><th class="num">GMV (đ)</th><th class="num">AOV chung (đ)</th><th>🏆 SP bán chạy nhất</th><th class="num">GMV SP</th><th class="num">AOV SP</th></tr></thead><tbody>';
  byKol.slice(0,10).forEach((r,i)=>{
    const aov2 = r.orders ? r.gmv/r.orders : 0;

    html += '<tr><td><strong>'+escHtml(k)+'</strong></td><td class="num">'+fmt(v.orders)+'</td><td class="num">'+fmt(v.gmv)+'</td><td class="num">'+fmtPct(monthTotalGmv?v.gmv/monthTotalGmv:0)+'</td></tr>';

}

// === LOOKUP ===
function renderLookup(){
  const data = applyFilters(RAW);
  const t = aggSum(data);
  const aov = t.orders ? t.gmv/t.orders : 0;

  let html = '<div style="font-size:13px;color:var(--muted);margin:-4px 0 12px;padding:0 4px">📅 Khoảng: <strong>'+(state.dateFrom||'?')+'</strong> → <strong>'+(state.dateTo||'?')+'</strong> · Trạng thái: <strong>'+([...state.statuses].join(', ') || 'Tất cả')+'</strong></div>';
  html += '<div class="kpi-grid">';
  html += kpiCard('GMV','<span style="font-size:18px">'+fmt(t.gmv)+'đ</span>');
  html += kpiCard('Số đơn', fmt(t.orders));
  html += kpiCard('Hoa hồng','<span style="font-size:18px">'+fmt(t.com)+'đ</span>');
  html += kpiCard('AOV','<span style="font-size:16px">'+fmt(aov)+'đ</span>');
  html += kpiCard('KOL', fmt(t.kols));
  html += kpiCard('SL bán', fmt(t.qty));
  html += '</div>';

  const byDay = aggBy(data, o=>o.date).filter(r=>r.key).sort((a,b)=>a.key.localeCompare(b.key));
  html += '<div class="panel"><h2><span class="zh">營收趨勢</span>Xu hướng doanh thu theo ngày</h2><div class="chart-wrap"><canvas id="cDayL"></canvas></div></div>';

  // === So sánh tăng trưởng cùng kỳ ===
  function dshift(s, days){
    const p = s.split('-').map(Number);
    const d = new Date(p[0], p[1]-1, p[2]);
    d.setDate(d.getDate()+days);
    const y = d.getFullYear();
    const m = String(d.getMonth()+1).padStart(2,'0');
    const dd = String(d.getDate()).padStart(2,'0');
    return y+'-'+m+'-'+dd;
  }
  function ndays(from, to){
    const a = from.split('-').map(Number), b = to.split('-').map(Number);
    const d1 = new Date(a[0],a[1]-1,a[2]), d2 = new Date(b[0],b[1]-1,b[2]);
    return Math.round((d2-d1)/86400000)+1;
  }
  function rangeData(from, to){
    return RAW.filter(o => {
      if(state.statuses.size>0 && !state.statuses.has(o.status)) return false;
      return o.date && o.date>=from && o.date<=to;
    });
  }
  if(state.dateFrom && state.dateTo){
    const N = ndays(state.dateFrom, state.dateTo);
    const prevFrom = dshift(state.dateFrom, -N), prevTo = dshift(state.dateFrom, -1);
    const prev2From = dshift(state.dateFrom, -2*N), prev2To = dshift(state.dateFrom, -N-1);
    const periods = [
      {label:'本期 Kỳ Này', sub:state.dateFrom+' → '+state.dateTo+' ('+N+' ngày)', data:data},
      {label:'上期 Kỳ Trước', sub:prevFrom+' → '+prevTo+' ('+N+' ngày)', data:rangeData(prevFrom, prevTo)},
      {label:'前上期 Kỳ Trước Nữa', sub:prev2From+' → '+prev2To+' ('+N+' ngày)', data:rangeData(prev2From, prev2To)},
    ];
    const periodAgg = periods.map(p=>aggSum(p.data));
    html += '<div class="panel"><h2><span class="zh">對比明細</span>So sánh tăng trưởng giữa các kỳ</h2>';
    html += '<table><thead><tr><th>Kỳ so sánh</th><th class="num">Doanh thu (đ)</th><th class="num">Đơn hàng</th><th class="num">AOV (đ)</th><th class="num">Tăng trưởng vs kỳ liền trước</th></tr></thead><tbody>';
    periods.forEach((p,idx)=>{
      const a = periodAgg[idx];
      const aov2 = a.orders ? a.gmv/a.orders : 0;
      // So sánh với kỳ liền kề cũ hơn (periods[idx+1])
      let chg = '<span class="badge badge-gray">— (không có kỳ trước)</span>';
      const older = periodAgg[idx+1];
      if(older){
        if(older.gmv>0){
          const diff = (a.gmv-older.gmv)/older.gmv;
          chg = '<span class="badge badge-'+(diff>=0?'green':'red')+'">'+(diff>=0?'▲':'▼')+' '+Math.abs(diff*100).toFixed(1)+'%</span>';
        } else { chg = '<span class="badge badge-gray">— (kỳ trước = 0)</span>'; }
      }
      html += '<tr><td><strong>'+p.label+'</strong><br><span style="font-size:11px;color:var(--muted)">'+p.sub+'</span></td><td class="num">'+fmt(a.gmv)+'</td><td class="num">'+fmt(a.orders)+'</td><td class="num">'+fmt(aov2)+'</td><td class="num">'+chg+'</td></tr>';
    });
    html += '</tbody></table>';

    html += '<div class="panel"><h2><span class="zh">暢銷產品 Top 5</span>Top 5 sản phẩm bán chạy — so sánh với kỳ trước</h2>';
    html += '<table><thead><tr><th>#</th><th>Sản phẩm</th><th class="num">SL</th><th class="num">GMV kỳ này (đ)</th><th class="num">GMV kỳ trước (đ)</th><th class="num">Thay đổi</th></tr></thead><tbody>';
    curProd.slice(0,5).forEach((r,i)=>{
      const name = r.key.length>70 ? r.key.substring(0,70)+'...' : r.key;
      const pv = prevProd[r.key] || 0;
      let chg = '<span class="badge badge-gray">mới</span>';
      if(pv>0){
        const diff = (r.gmv-pv)/pv;
        chg = '<span class="badge badge-'+(diff>=0?'green':'red')+'">'+(diff>=0?'▲':'▼')+' '+Math.abs(diff*100).toFixed(1)+'%</span>';
      }
      html += '<tr><td>'+(i+1)+'</td><td style="font-size:12px">'+escHtml(name)+'</td><td class="num">'+fmt(r.qty)+'</td><td class="num">'+fmt(r.gmv)+'</td><td class="num">'+fmt(pv)+'</td><td class="num">'+chg+'</td></tr>';
    });
    html += '</tbody></table></div>';
  }

  const byKol = aggBy(data, o=>o.kol).filter(r=>r.key).sort((a,b)=>b.gmv-a.gmv);
  // Data KOL kỳ trước để so sánh
  let prevByKol = [];
  if(state.dateFrom && state.dateTo){
    const Nk = ndays(state.dateFrom, state.dateTo);
    const pkF = dshift(state.dateFrom, -Nk), pkT = dshift(state.dateFrom, -1);
    prevByKol = aggBy(rangeData(pkF, pkT), o=>o.kol).filter(r=>r.key).sort((a,b)=>b.gmv-a.gmv);
  }
  function kolTableRows(arr){
    let s = '';
    arr.slice(0,10).forEach((r,i)=>{
      const rank = i<3 ? '<span class="badge badge-gold">#'+(i+1)+'</span>' : (i+1);
      s += '<tr><td>'+rank+'</td><td><strong>'+escHtml(r.key)+'</strong></td><td class="num">'+fmt(r.orders)+'</td><td class="num">'+fmt(r.gmv)+'</td><td class="num">'+fmt(r.com)+'</td></tr>';
    });
    if(!arr.length) s = '<tr><td colspan="5" style="text-align:center;color:var(--muted);padding:20px">Không có dữ liệu</td></tr>';
    return s;
  }
  html += '<div class="grid-2">';
  html += '<div class="panel"><h2><span class="zh">本期達人 Top 10</span>Top 10 KOL bán chạy nhất — Kỳ này</h2>';
  html += '<table><thead><tr><th>#</th><th>KOL</th><th class="num">Đơn</th><th class="num">GMV (đ)</th><th class="num">Hoa hồng (đ)</th></tr></thead><tbody>';
  html += kolTableRows(byKol);
  html += '</tbody></table></div>';
  html += '<div class="panel"><h2><span class="zh">上期達人 Top 10</span>Top 10 KOL bán chạy nhất — Kỳ trước</h2>';
  html += '<table><thead><tr><th>#</th><th>KOL</th><th class="num">Đơn</th><th class="num">GMV (đ)</th><th class="num">Hoa hồng (đ)</th></tr></thead><tbody>';
  html += kolTableRows(prevByKol);
  html += '</tbody></table></div>';
  html += '</div>';

  // === Panel KOL so sánh cùng kỳ tháng trước - ĐỘC LẬP với filter tab ===
  // Có ô chọn ngày riêng. CHỈ tính "Đã quyết toán".
  if(!state.kolMomFrom && state.dateFrom) state.kolMomFrom = state.dateFrom;
  if(!state.kolMomTo && state.dateTo) state.kolMomTo = state.dateTo;

  html += '<div class="panel" id="kolMomPanel">';
  html += '<h2><span class="zh">達人營收 — 月度同期對比</span>Doanh thu KOL — So sánh cùng kỳ tháng trước (chỉ tính "Đã quyết toán")</h2>';
  html += '<div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:10px 14px;background:var(--bg);border-radius:8px;margin-bottom:14px">';
  html += '<span style="font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.5px">📅 Chọn ngày riêng cho mục này:</span>';
  html += '<input type="date" id="momFrom" value="'+(state.kolMomFrom||'')+'" style="padding:6px 10px;border:1.5px solid var(--border);border-radius:6px;font-size:13px;font-family:inherit"> – ';
  html += '<input type="date" id="momTo" value="'+(state.kolMomTo||'')+'" style="padding:6px 10px;border:1.5px solid var(--border);border-radius:6px;font-size:13px;font-family:inherit">';
  html += '<button class="btn" id="momReset" style="padding:5px 12px;font-size:11px">↻ Đồng bộ với filter tab</button>';
  html += '</div>';
  html += '<div id="momContent"></div>';
  html += '</div>';

  html += '<div class="panel"><h2><span class="zh">每日明細</span>Chi tiết theo ngày</h2>';
  html += '<table id="tblDays"><thead><tr><th>Ngày</th><th class="num">Đơn</th><th class="num">SL</th><th class="num">GMV (đ)</th><th class="num">Hoa hồng (đ)</th><th class="num">AOV (đ)</th></tr></thead><tbody>';
  byDay.forEach(r=>{
    const a2 = r.orders ? r.gmv/r.orders : 0;
    html += '<tr><td><strong>'+r.key+'</strong></td><td class="num">'+fmt(r.orders)+'</td><td class="num">'+fmt(r.qty)+'</td><td class="num">'+fmt(r.gmv)+'</td><td class="num">'+fmt(r.com)+'</td><td class="num">'+fmt(a2)+'</td></tr>';
  });
  html += '</tbody></table><div class="pager" id="pagerDays"></div></div>';

  document.getElementById('content').innerHTML = html;
  paginateTable('tblDays', 'pagerDays', 5);

  // ===== Panel KOL so sánh cùng kỳ tháng trước: build content + bind events =====
  function shiftMonthDate(s, months){
    if(!s) return '';
    const p = s.split('-').map(Number);
    let y = p[0], m = p[1]-months, d = p[2];
    while(m < 1){ m += 12; y -= 1; }
    while(m > 12){ m -= 12; y += 1; }
    const lastDay = new Date(y, m, 0).getDate();
    return y+'-'+String(m).padStart(2,'0')+'-'+String(Math.min(d, lastDay)).padStart(2,'0');
  }
  function buildMomContent(fromDate, toDate){
    const el = document.getElementById('momContent');
    if(!el) return;
    if(!fromDate || !toDate){ el.innerHTML = '<em style="color:var(--muted)">Vui lòng chọn khoảng ngày.</em>'; return; }
    const mmFrom = shiftMonthDate(fromDate, 1);
    const mmTo = shiftMonthDate(toDate, 1);
    const settledRange = (from, to) => RAW.filter(o => o.status==='Đã quyết toán' && o.date && o.date>=from && o.date<=to);
    const curData = settledRange(fromDate, toDate);
    const mmData = settledRange(mmFrom, mmTo);
    const accMap = arr => {
      const m = {};
      arr.forEach(o=>{
        if(!o.kol) return;
        if(!m[o.kol]) m[o.kol] = {orders:0, gmv:0};
        m[o.kol].orders++; m[o.kol].gmv += o.payment;
      });
      return m;
    };
    const curMap = accMap(curData), mmMap = accMap(mmData);
    const allKols = new Set([...Object.keys(curMap), ...Object.keys(mmMap)]);
    const merged = [...allKols].map(k => ({
      kol: k,
      curGmv: (curMap[k]||{}).gmv || 0, curOrders: (curMap[k]||{}).orders || 0,
      mmGmv: (mmMap[k]||{}).gmv || 0, mmOrders: (mmMap[k]||{}).orders || 0,
    }));
    merged.sort((a,b)=>b.curGmv-a.curGmv);
    const curTotal = curData.reduce((s,o)=>s+o.payment,0);
    const mmTotal = mmData.reduce((s,o)=>s+o.payment,0);
    const diffTotal = mmTotal>0 ? (curTotal-mmTotal)/mmTotal : null;

    let h = '<div style="font-size:12px;color:var(--muted);margin-bottom:12px">📅 Kỳ này: <strong>'+fromDate+' → '+toDate+'</strong> · Cùng kỳ tháng trước: <strong>'+mmFrom+' → '+mmTo+'</strong></div>';
    h += '<div class="kpi-grid" style="grid-template-columns:repeat(3,1fr);margin-bottom:14px">';
    h += kpiCard('GMV kỳ này', '<span style="font-size:16px">'+fmt(curTotal)+'đ</span>');
    h += kpiCard('GMV cùng kỳ tháng trước', '<span style="font-size:16px">'+fmt(mmTotal)+'đ</span>');
    let tk = '<span style="font-size:12px;color:var(--muted)">không có kỳ trước</span>';
    if(diffTotal !== null){
      const arrow = diffTotal>=0?'▲':'▼';
      const cls = diffTotal>=0?'up':'down';
      tk = '<span class="delta '+cls+'" style="font-size:18px;font-weight:700">'+arrow+' '+Math.abs(diffTotal*100).toFixed(1)+'%</span>';
    }
    h += kpiCard('Thay đổi tổng', tk);
    h += '</div>';
    h += '<table id="tblKolMoM"><thead><tr><th>#</th><th>KOL</th><th class="num">GMV kỳ này (đ)</th><th class="num">Đơn kỳ này</th><th class="num">GMV cùng kỳ tháng trước (đ)</th><th class="num">Đơn cùng kỳ</th><th class="num">Thay đổi</th></tr></thead><tbody>';
    if(!merged.length){
      h += '<tr><td colspan="7" style="text-align:center;color:var(--muted);padding:20px">Không có dữ liệu trong khoảng ngày này</td></tr>';
    }
    merged.forEach((r,i)=>{
      const rank = i<3 ? '<span class="badge badge-gold">#'+(i+1)+'</span>' : (i+1);
      let chg = '<span class="badge badge-gray">mới</span>';
      if(r.mmGmv>0){
        const diff = (r.curGmv-r.mmGmv)/r.mmGmv;
        chg = '<span class="badge badge-'+(diff>=0?'green':'red')+'">'+(diff>=0?'▲':'▼')+' '+Math.abs(diff*100).toFixed(1)+'%</span>';
      } else if(r.curGmv === 0){
        chg = '<span class="badge badge-gray">—</span>';
      }
      h += '<tr><td>'+rank+'</td><td><strong>'+escHtml(r.kol)+'</strong></td><td class="num">'+fmt(r.curGmv)+'</td><td class="num">'+fmt(r.curOrders)+'</td><td class="num">'+fmt(r.mmGmv)+'</td><td class="num">'+fmt(r.mmOrders)+'</td><td class="num">'+chg+'</td></tr>';
    });
    h += '</tbody></table><div class="pager" id="pagerKolMoM"></div>';
    el.innerHTML = h;
    paginateTable('tblKolMoM', 'pagerKolMoM', 10);
  }
  const momFromEl = document.getElementById('momFrom');
  const momToEl = document.getElementById('momTo');
  const momResetEl = document.getElementById('momReset');
  if(momFromEl){
    momFromEl.onchange = () => { state.kolMomFrom = momFromEl.value; buildMomContent(state.kolMomFrom, state.kolMomTo); };
    momToEl.onchange = () => { state.kolMomTo = momToEl.value; buildMomContent(state.kolMomFrom, state.kolMomTo); };
    momResetEl.onclick = () => {
      state.kolMomFrom = state.dateFrom; state.kolMomTo = state.dateTo;
      momFromEl.value = state.dateFrom||''; momToEl.value = state.dateTo||'';
      buildMomContent(state.kolMomFrom, state.kolMomTo);
    };
    buildMomContent(state.kolMomFrom, state.kolMomTo);
  }

  mkChart('cDayL','dayL',{
    type:'line',
    data:{
      labels: byDay.map(r=>r.key),
      datasets:[{label:'GMV', data: byDay.map(r=>r.gmv), borderColor:'#0E4D8B', backgroundColor:'rgba(14,77,139,.15)', tension:.3, fill:true}]
    },
    options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>fmt(c.parsed.y)+'đ'}}},
      scales:{y:{ticks:{callback:v=>fmtK(v)}}}}
  });
}

// === REPORT ===
function renderReport(){
  // Bỏ qua filter status ở trên, chỉ áp date range
  const dateOnly = RAW.filter(o => {
    if(state.dateFrom && o.date && o.date < state.dateFrom) return false;
    if(state.dateTo && o.date && o.date > state.dateTo) return false;
    return true;
  });
  const INELIGIBLE = 'Không đủ điều kiện';
  const SETTLED = 'Đã quyết toán';

  const totalAll = dateOnly.reduce((s,o)=>s+o.payment, 0);
  const totalSettled = dateOnly.filter(o=>o.status===SETTLED).reduce((s,o)=>s+o.payment, 0);
  const totalExpected = dateOnly.filter(o=>o.status!==INELIGIBLE).reduce((s,o)=>s+o.payment, 0);
  const totalIneligible = dateOnly.filter(o=>o.status===INELIGIBLE).reduce((s,o)=>s+o.payment, 0);

  const ordAll = dateOnly.length;
  const ordSettled = dateOnly.filter(o=>o.status===SETTLED).length;
  const ordExpected = dateOnly.filter(o=>o.status!==INELIGIBLE).length;

  let html = '<div style="font-size:13px;color:var(--muted);margin:-4px 0 12px;padding:0 4px">📅 Khoảng: <strong>'+(state.dateFrom||'?')+'</strong> → <strong>'+(state.dateTo||'?')+'</strong> · <em>(Tab này bỏ qua bộ lọc trạng thái ở trên)</em></div>';

  // 3 KPI lớn
  html += '<div class="kpi-grid" style="grid-template-columns:repeat(auto-fit,minmax(280px,1fr))">';
  html += '<div class="kpi" style="border-left-color:var(--gold)"><div class="lab">💰 DOANH SỐ TỔNG (bao gồm KĐK)</div><div class="val" style="font-size:24px">'+fmt(totalAll)+'đ</div><div class="delta" style="color:var(--muted)">'+fmt(ordAll)+' đơn · toàn bộ trạng thái</div></div>';
  html += '<div class="kpi" style="border-left-color:var(--green)"><div class="lab">✅ DOANH SỐ QUYẾT TOÁN</div><div class="val" style="font-size:24px;color:var(--green)">'+fmt(totalSettled)+'đ</div><div class="delta" style="color:var(--muted)">'+fmt(ordSettled)+' đơn · chỉ "Đã quyết toán"</div></div>';
  html += '<div class="kpi" style="border-left-color:var(--accent)"><div class="lab">🔮 DOANH SỐ DỰ KIẾN SAU QUYẾT TOÁN</div><div class="val" style="font-size:24px;color:var(--accent)">'+fmt(totalExpected)+'đ</div><div class="delta" style="color:var(--muted)">'+fmt(ordExpected)+' đơn · trừ "Không đủ điều kiện"</div></div>';
  html += '</div>';

  // Bảng chi tiết theo trạng thái
  const byStatus = {};
  dateOnly.forEach(o => {
    if(!byStatus[o.status]) byStatus[o.status] = {orders:0, qty:0, gmv:0, com:0};
    byStatus[o.status].orders++;
    byStatus[o.status].qty += o.qty;
    byStatus[o.status].gmv += o.payment;
    byStatus[o.status].com += o.com;
  });
  html += '<div class="panel"><h2><span class="zh">訂單狀態明細</span>Chi tiết theo trạng thái đơn</h2>';
  html += '<table><thead><tr><th>Trạng thái</th><th class="num">Đơn</th><th class="num">SL</th><th class="num">Doanh số (đ)</th><th class="num">Hoa hồng (đ)</th><th class="num">% Doanh số tổng</th></tr></thead><tbody>';
  Object.entries(byStatus).sort((a,b)=>b[1].gmv-a[1].gmv).forEach(([k,v])=>{
    const cls = k===INELIGIBLE ? 'badge-red' : (k===SETTLED ? 'badge-green' : 'badge-gold');
    html += '<tr><td><span class="badge '+cls+'">'+escHtml(k)+'</span></td><td class="num">'+fmt(v.orders)+'</td><td class="num">'+fmt(v.qty)+'</td><td class="num">'+fmt(v.gmv)+'</td><td class="num">'+fmt(v.com)+'</td><td class="num">'+fmtPct(totalAll?v.gmv/totalAll:0)+'</td></tr>';
  });
  html += '<tr style="background:var(--bg);font-weight:700"><td>TỔNG</td><td class="num">'+fmt(ordAll)+'</td><td class="num">'+fmt(dateOnly.reduce((s,o)=>s+o.qty,0))+'</td><td class="num">'+fmt(totalAll)+'</td><td class="num">'+fmt(dateOnly.reduce((s,o)=>s+o.com,0))+'</td><td class="num">100.0%</td></tr>';
  html += '</tbody></table></div>';

  // Biểu đồ 3 chỉ số
  html += '<div class="panel"><h2><span class="zh">三大指標對比</span>So sánh 3 chỉ số doanh số</h2><div class="chart-wrap"><canvas id="cReport"></canvas></div></div>';

  // ============ HELPER: tính 3 chỉ số cho 1 khoảng ngày ============
  function calc3(from, to){
    const arr = RAW.filter(o => o.date && o.date>=from && o.date<=to);
    return {
      orders: arr.length,
      all: arr.reduce((s,o)=>s+o.payment,0),
      settled: arr.filter(o=>o.status===SETTLED).reduce((s,o)=>s+o.payment,0),
      expected: arr.filter(o=>o.status!==INELIGIBLE).reduce((s,o)=>s+o.payment,0),
    };
  }
  function dshiftR(s, days){
    const p = s.split('-').map(Number);
    const d = new Date(p[0], p[1]-1, p[2]);
    d.setDate(d.getDate()+days);
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  }
  function ndaysR(from, to){
    const a = from.split('-').map(Number), b = to.split('-').map(Number);
    const d1 = new Date(a[0],a[1]-1,a[2]), d2 = new Date(b[0],b[1]-1,b[2]);
    return Math.round((d2-d1)/86400000)+1;
  }
  function shiftMonth(s, months){
    const p = s.split('-').map(Number);
    let y = p[0], m = p[1]-months, d = p[2];
    while(m < 1){ m += 12; y -= 1; }
    while(m > 12){ m -= 12; y += 1; }
    const lastDay = new Date(y, m, 0).getDate();
    return y+'-'+String(m).padStart(2,'0')+'-'+String(Math.min(d, lastDay)).padStart(2,'0');
  }
  function changeCell(cur, prev){
    if(!prev) return '<span class="badge badge-gray">—</span>';
    const diff = (cur-prev)/prev;
    return '<span class="badge badge-'+(diff>=0?'green':'red')+'">'+(diff>=0?'▲':'▼')+' '+Math.abs(diff*100).toFixed(1)+'%</span>';
  }

  // ============ HELPER: build KOL/Product comparison tables (3 chỉ số song song) ============
  function accumBy3(arr, keyFn){
    const m = {};
    arr.forEach(o => {
      const k = keyFn(o); if(k===null || k===undefined) return;
      if(!m[k]) m[k] = {orders:0, qty:0, settled:0, expected:0};
      m[k].orders += 1;
      m[k].qty += (o.qty||0);
      if(o.status===SETTLED) m[k].settled += o.payment;
      if(o.status!==INELIGIBLE) m[k].expected += o.payment;
    });
    return m;
  }
  function chgBadge(cur, prev){
    if(prev>0){
      const d = (cur-prev)/prev;
      return '<span class="badge badge-'+(d>=0?'green':'red')+'">'+(d>=0?'▲':'▼')+' '+Math.abs(d*100).toFixed(1)+'%</span>';
    }
    if(cur>0) return '<span class="badge badge-gray">mới</span>';
    return '<span class="badge badge-gray">—</span>';
  }
  function build3Cmp(dataA, dataB, keyFn, isProduct, tblId, pagerId){
    const mapA = accumBy3(dataA, keyFn), mapB = accumBy3(dataB, keyFn);
    const allK = new Set([...Object.keys(mapA), ...Object.keys(mapB)]);
    // KOL → dùng "orders" (số đơn); Sản phẩm → dùng "qty" (số lượng sản phẩm)
    const cntField = isProduct ? 'qty' : 'orders';
    const cntHead = isProduct ? '📦 SL sản phẩm' : '🧾 Số đơn';
    const arr = [...allK].map(k => ({
      key: k,
      curCnt:(mapA[k]||{})[cntField]||0, curSet:(mapA[k]||{}).settled||0, curExp:(mapA[k]||{}).expected||0,
      prevCnt:(mapB[k]||{})[cntField]||0, prevSet:(mapB[k]||{}).settled||0, prevExp:(mapB[k]||{}).expected||0,
    })).sort((a,b)=>b.curSet-a.curSet);
    const colLabel = isProduct ? 'Sản phẩm' : 'KOL';
    let h = '<table id="'+tblId+'">';
    h += '<thead><tr>';
    h += '<th>#</th><th>'+colLabel+'</th>';
    h += '<th class="num" style="background:#fdf1d4">'+cntHead+'</th><th class="num" style="background:#fdf1d4">%Δ</th>';
    h += '<th class="num" style="background:#e8f3d6">✅ DS Quyết toán (đ)</th><th class="num" style="background:#e8f3d6">%Δ</th>';
    h += '<th class="num" style="background:#f5e0d0">🔮 DS Dự kiến (đ)</th><th class="num" style="background:#f5e0d0">%Δ</th>';
    h += '</tr></thead><tbody>';
    arr.forEach((r,i)=>{
      const rank = i<3 ? '<span class="badge badge-gold">#'+(i+1)+'</span>' : (i+1);
      const nameCell = isProduct
        ? '<td style="font-size:12px">'+escHtml(r.key.length>60?r.key.substring(0,60)+'...':r.key)+'</td>'
        : '<td><strong>'+escHtml(r.key)+'</strong></td>';
      h += '<tr><td>'+rank+'</td>'+nameCell
        + '<td class="num" style="font-weight:600">'+fmt(r.curCnt)+'</td><td class="num">'+chgBadge(r.curCnt,r.prevCnt)+'</td>'
        + '<td class="num" style="color:var(--green);font-weight:600">'+fmt(r.curSet)+'</td><td class="num">'+chgBadge(r.curSet,r.prevSet)+'</td>'
        + '<td class="num" style="color:var(--accent);font-weight:600">'+fmt(r.curExp)+'</td><td class="num">'+chgBadge(r.curExp,r.prevExp)+'</td>'
        + '</tr>';
    });
    if(!arr.length) h += '<tr><td colspan="8" style="text-align:center;color:var(--muted);padding:20px">Không có dữ liệu</td></tr>';
    h += '</tbody></table><div class="pager" id="'+pagerId+'"></div>';
    return h;
  }
  function buildKolCmp(dataA, dataB, labelA, labelB, tblId, pagerId){
    return build3Cmp(dataA, dataB, o=>o.kol||null, false, tblId, pagerId);
  }
  function buildProdCmp(dataA, dataB, labelA, labelB, tblId, pagerId){
    return build3Cmp(dataA, dataB, o=>groupProduct(o.product), true, tblId, pagerId);
  }
  function rangeRaw(from, to){
    return RAW.filter(o => o.date && o.date>=from && o.date<=to);
  }

  if(state.dateFrom && state.dateTo){
    const N = ndaysR(state.dateFrom, state.dateTo);
    const p1From = dshiftR(state.dateFrom, -N), p1To = dshiftR(state.dateFrom, -1);
    const p2From = dshiftR(state.dateFrom, -2*N), p2To = dshiftR(state.dateFrom, -N-1);
    const cur = calc3(state.dateFrom, state.dateTo);
    const p1 = calc3(p1From, p1To);
    const p2 = calc3(p2From, p2To);

    // ============ SECTION 1: BÁO CÁO TUẦN / KỲ - so sánh 3 kỳ liền kề ============
    html += '<div class="panel" style="border-left:4px solid var(--primary)"><h2><span class="zh">📅 週報告 / 期間對比</span>① Báo cáo dữ liệu tuần — So sánh với '+N+' ngày trước &amp; '+N+' ngày trước nữa</h2>';
    html += '<div style="font-size:12px;color:var(--muted);margin-bottom:12px">Khoảng '+N+' ngày → tự động so sánh với 2 khoảng '+N+' ngày liền trước.</div>';
    html += '<table><thead><tr><th>Kỳ</th><th class="num">Đơn</th><th class="num">💰 DS Tổng (đ)</th><th class="num">Δ vs kỳ trước</th><th class="num">✅ DS Quyết toán (đ)</th><th class="num">Δ vs kỳ trước</th><th class="num">🔮 DS Dự kiến (đ)</th><th class="num">Δ vs kỳ trước</th></tr></thead><tbody>';
    html += '<tr style="background:#fdf9f1"><td><strong>本期 Kỳ này</strong><br><span style="font-size:11px;color:var(--muted)">'+state.dateFrom+' → '+state.dateTo+'</span></td><td class="num">'+fmt(cur.orders)+'</td><td class="num">'+fmt(cur.all)+'</td><td class="num">'+changeCell(cur.all, p1.all)+'</td><td class="num" style="color:var(--green);font-weight:600">'+fmt(cur.settled)+'</td><td class="num">'+changeCell(cur.settled, p1.settled)+'</td><td class="num" style="color:var(--accent);font-weight:600">'+fmt(cur.expected)+'</td><td class="num">'+changeCell(cur.expected, p1.expected)+'</td></tr>';
    html += '<tr><td><strong>上期 Kỳ trước</strong><br><span style="font-size:11px;color:var(--muted)">'+p1From+' → '+p1To+'</span></td><td class="num">'+fmt(p1.orders)+'</td><td class="num">'+fmt(p1.all)+'</td><td class="num">'+changeCell(p1.all, p2.all)+'</td><td class="num" style="color:var(--green)">'+fmt(p1.settled)+'</td><td class="num">'+changeCell(p1.settled, p2.settled)+'</td><td class="num" style="color:var(--accent)">'+fmt(p1.expected)+'</td><td class="num">'+changeCell(p1.expected, p2.expected)+'</td></tr>';
    html += '<tr><td><strong>前上期 Kỳ trước nữa</strong><br><span style="font-size:11px;color:var(--muted)">'+p2From+' → '+p2To+'</span></td><td class="num">'+fmt(p2.orders)+'</td><td class="num">'+fmt(p2.all)+'</td><td class="num"><span class="badge badge-gray">—</span></td><td class="num" style="color:var(--green)">'+fmt(p2.settled)+'</td><td class="num"><span class="badge badge-gray">—</span></td><td class="num" style="color:var(--accent)">'+fmt(p2.expected)+'</td><td class="num"><span class="badge badge-gray">—</span></td></tr>';
    html += '</tbody></table>';
    html += '<div class="chart-wrap" style="margin-top:16px"><canvas id="cReportWeek"></canvas></div>';

    // KOL comparison — this week vs last week
    const curRaw = rangeRaw(state.dateFrom, state.dateTo);
    const p1Raw = rangeRaw(p1From, p1To);
    html += '<h3 style="margin-top:24px;font-size:14px;color:var(--primary);border-bottom:1.5px solid var(--border);padding-bottom:6px">👥 So sánh KOL — Kỳ này vs Kỳ trước ('+N+' ngày)</h3>';
    html += buildKolCmp(curRaw, p1Raw, 'Kỳ này', 'Kỳ trước', 'tblKolWeek', 'pagerKolWeek');
    html += '<h3 style="margin-top:24px;font-size:14px;color:var(--primary);border-bottom:1.5px solid var(--border);padding-bottom:6px">📦 So sánh Sản phẩm — Kỳ này vs Kỳ trước ('+N+' ngày)</h3>';
    html += buildProdCmp(curRaw, p1Raw, 'Kỳ này', 'Kỳ trước', 'tblProdWeek', 'pagerProdWeek');
    html += '</div>';

  }

  // ============ SECTION 2: SO SÁNH CÙNG KỲ THÁNG TRƯỚC — ĐỘC LẬP với filter trên ============
  // Default: current = top filter, comparison = 1 month back from current
  if(!state.reportCurFrom) state.reportCurFrom = state.dateFrom;
  if(!state.reportCurTo) state.reportCurTo = state.dateTo;
  if(!state.reportCmpFrom && state.reportCurFrom) state.reportCmpFrom = shiftMonth(state.reportCurFrom, 1);
  if(!state.reportCmpTo && state.reportCurTo) state.reportCmpTo = shiftMonth(state.reportCurTo, 1);

  if(state.reportCurFrom && state.reportCurTo && state.reportCmpFrom && state.reportCmpTo){
    const curF = state.reportCurFrom, curT = state.reportCurTo;
    const cmpFrom = state.reportCmpFrom, cmpTo = state.reportCmpTo;
    const curM = calc3(curF, curT);
    const mm = calc3(cmpFrom, cmpTo);

    html += '<div class="panel" style="border-left:4px solid var(--accent)"><h2><span class="zh">📆 月度同期對比</span>② So sánh cùng kỳ tháng — Chọn cả 2 khoảng độc lập (không ảnh hưởng bởi filter tuần ở trên)</h2>';
    html += '<div style="display:flex;flex-wrap:wrap;gap:20px;align-items:center;padding:12px 14px;background:var(--bg);border-radius:8px;margin-bottom:14px">';
    html += '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">';
    html += '<span style="font-size:11px;color:var(--green);font-weight:700;text-transform:uppercase;letter-spacing:.5px">📅 Kỳ này:</span>';
    html += '<input type="date" id="rptCurFrom" value="'+curF+'" style="padding:6px 10px;border:1.5px solid var(--green);border-radius:6px;font-size:13px;font-family:inherit"> – ';
    html += '<input type="date" id="rptCurTo" value="'+curT+'" style="padding:6px 10px;border:1.5px solid var(--green);border-radius:6px;font-size:13px;font-family:inherit">';
    html += '</div>';
    html += '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">';
    html += '<span style="font-size:11px;color:var(--accent);font-weight:700;text-transform:uppercase;letter-spacing:.5px">📅 Kỳ đối chiếu:</span>';
    html += '<input type="date" id="rptCmpFrom" value="'+cmpFrom+'" style="padding:6px 10px;border:1.5px solid var(--accent);border-radius:6px;font-size:13px;font-family:inherit"> – ';
    html += '<input type="date" id="rptCmpTo" value="'+cmpTo+'" style="padding:6px 10px;border:1.5px solid var(--accent);border-radius:6px;font-size:13px;font-family:inherit">';
    html += '</div>';
    html += '<button class="btn" id="rptCmpReset" style="padding:5px 12px;font-size:11px">↻ Kỳ đối chiếu = tháng trước (tự động)</button>';
    html += '</div>';
    html += '<table><thead><tr><th>Kỳ</th><th class="num">Đơn</th><th class="num">💰 DS Tổng (đ)</th><th class="num">✅ DS Quyết toán (đ)</th><th class="num">🔮 DS Dự kiến (đ)</th></tr></thead><tbody>';
    html += '<tr style="background:#fdf9f1"><td><strong>本期 Kỳ này</strong><br><span style="font-size:11px;color:var(--muted)">'+curF+' → '+curT+'</span></td><td class="num">'+fmt(curM.orders)+'</td><td class="num">'+fmt(curM.all)+'</td><td class="num" style="color:var(--green);font-weight:600">'+fmt(curM.settled)+'</td><td class="num" style="color:var(--accent);font-weight:600">'+fmt(curM.expected)+'</td></tr>';
    html += '<tr><td><strong>對照期 Kỳ đối chiếu</strong><br><span style="font-size:11px;color:var(--muted)">'+cmpFrom+' → '+cmpTo+'</span></td><td class="num">'+fmt(mm.orders)+'</td><td class="num">'+fmt(mm.all)+'</td><td class="num" style="color:var(--green)">'+fmt(mm.settled)+'</td><td class="num" style="color:var(--accent)">'+fmt(mm.expected)+'</td></tr>';
    html += '<tr style="background:var(--bg);font-weight:700"><td>Δ Thay đổi</td><td class="num">'+changeCell(curM.orders, mm.orders)+'</td><td class="num">'+changeCell(curM.all, mm.all)+'</td><td class="num">'+changeCell(curM.settled, mm.settled)+'</td><td class="num">'+changeCell(curM.expected, mm.expected)+'</td></tr>';
    html += '</tbody></table>';
    html += '<div class="chart-wrap" style="margin-top:16px"><canvas id="cReportMonth"></canvas></div>';

    // KOL + Product comparison — dùng dates độc lập
    const curMonthRaw = rangeRaw(curF, curT);
    const mmRaw = rangeRaw(cmpFrom, cmpTo);
    html += '<h3 style="margin-top:24px;font-size:14px;color:var(--accent);border-bottom:1.5px solid var(--border);padding-bottom:6px">👥 So sánh KOL — Kỳ này vs Kỳ đối chiếu</h3>';
    html += buildKolCmp(curMonthRaw, mmRaw, 'Kỳ này', 'Đối chiếu', 'tblKolMonth', 'pagerKolMonth');
    html += '<h3 style="margin-top:24px;font-size:14px;color:var(--accent);border-bottom:1.5px solid var(--border);padding-bottom:6px">📦 So sánh Sản phẩm — Kỳ này vs Kỳ đối chiếu</h3>';
    html += buildProdCmp(curMonthRaw, mmRaw, 'Kỳ này', 'Đối chiếu', 'tblProdMonth', 'pagerProdMonth');
    html += '</div>';
  }

  // === Top KOL với 3 chỉ số ===
  const kolMap = {};
  dateOnly.forEach(o=>{
    if(!o.kol) return;
    if(!kolMap[o.kol]) kolMap[o.kol] = {orders:0, all:0, settled:0, expected:0, com:0};
    kolMap[o.kol].orders++;
    kolMap[o.kol].all += o.payment;
    if(o.status===SETTLED) kolMap[o.kol].settled += o.payment;
    if(o.status!==INELIGIBLE) kolMap[o.kol].expected += o.payment;
    kolMap[o.kol].com += o.com;
  });
  const kolArr = Object.entries(kolMap).map(([k,v])=>({kol:k, ...v})).sort((a,b)=>b.all-a.all);
  html += '<div class="panel"><h2><span class="zh">達人三大指標排名</span>Top KOL theo 3 chỉ số ('+kolArr.length+' KOL)</h2>';
  html += '<table id="tblReportKol"><thead><tr><th>#</th><th>KOL</th><th class="num">Đơn</th><th class="num">💰 DS Tổng (đ)</th><th class="num">✅ DS Quyết toán (đ)</th><th class="num">🔮 DS Dự kiến (đ)</th><th class="num">Hoa hồng (đ)</th></tr></thead><tbody>';
  kolArr.forEach((r,i)=>{
    const rank = i<3 ? '<span class="badge badge-gold">#'+(i+1)+'</span>' : (i+1);
    html += '<tr><td>'+rank+'</td><td><strong>'+escHtml(r.kol)+'</strong></td><td class="num">'+fmt(r.orders)+'</td><td class="num">'+fmt(r.all)+'</td><td class="num" style="color:var(--green);font-weight:600">'+fmt(r.settled)+'</td><td class="num" style="color:var(--accent);font-weight:600">'+fmt(r.expected)+'</td><td class="num">'+fmt(r.com)+'</td></tr>';
  });
  if(!kolArr.length) html += '<tr><td colspan="7" style="text-align:center;color:var(--muted);padding:20px">Không có dữ liệu</td></tr>';
  html += '</tbody></table><div class="pager" id="pagerReportKol"></div></div>';

  // === Top Sản phẩm với 3 chỉ số ===
  const prodMap = {};
  dateOnly.forEach(o=>{
    const k = groupProduct(o.product);
    if(!prodMap[k]) prodMap[k] = {orders:0, qty:0, all:0, settled:0, expected:0};
    prodMap[k].orders++;
    prodMap[k].qty += o.qty;
    prodMap[k].all += o.payment;
    if(o.status===SETTLED) prodMap[k].settled += o.payment;
    if(o.status!==INELIGIBLE) prodMap[k].expected += o.payment;
  });
  const prodArr = Object.entries(prodMap).map(([k,v])=>({name:k, ...v})).sort((a,b)=>b.all-a.all);
  html += '<div class="panel"><h2><span class="zh">產品三大指標排名</span>Top Sản phẩm theo 3 chỉ số ('+prodArr.length+' SP)</h2>';
  html += '<table id="tblReportProd"><thead><tr><th>#</th><th>Sản phẩm</th><th class="num">Đơn</th><th class="num">SL</th><th class="num">💰 DS Tổng (đ)</th><th class="num">✅ DS Quyết toán (đ)</th><th class="num">🔮 DS Dự kiến (đ)</th></tr></thead><tbody>';
  prodArr.forEach((r,i)=>{
    const rank = i<3 ? '<span class="badge badge-gold">#'+(i+1)+'</span>' : (i+1);
    const name = r.name.length>80 ? r.name.substring(0,80)+'...' : r.name;
    html += '<tr><td>'+rank+'</td><td style="font-size:12px">'+escHtml(name)+'</td><td class="num">'+fmt(r.orders)+'</td><td class="num">'+fmt(r.qty)+'</td><td class="num">'+fmt(r.all)+'</td><td class="num" style="color:var(--green);font-weight:600">'+fmt(r.settled)+'</td><td class="num" style="color:var(--accent);font-weight:600">'+fmt(r.expected)+'</td></tr>';
  });
  if(!prodArr.length) html += '<tr><td colspan="7" style="text-align:center;color:var(--muted);padding:20px">Không có dữ liệu</td></tr>';
  html += '</tbody></table><div class="pager" id="pagerReportProd"></div></div>';

  // Bảng ngày với 3 chỉ số
  const dates = [...new Set(dateOnly.map(o=>o.date).filter(Boolean))].sort();
  html += '<div class="panel"><h2><span class="zh">每日三大指標</span>Chi tiết 3 chỉ số theo ngày</h2>';
  html += '<table id="tblReportDays"><thead><tr><th>Ngày</th><th class="num">DS Tổng (đ)</th><th class="num">DS Quyết toán (đ)</th><th class="num">DS Dự kiến (đ)</th><th class="num">Đơn KĐK</th></tr></thead><tbody>';
  dates.forEach(d=>{
    const dayOrders = dateOnly.filter(o=>o.date===d);
    const dAll = dayOrders.reduce((s,o)=>s+o.payment,0);
    const dSet = dayOrders.filter(o=>o.status===SETTLED).reduce((s,o)=>s+o.payment,0);
    const dExp = dayOrders.filter(o=>o.status!==INELIGIBLE).reduce((s,o)=>s+o.payment,0);
    const dIne = dayOrders.filter(o=>o.status===INELIGIBLE).length;
    html += '<tr><td><strong>'+d+'</strong></td><td class="num">'+fmt(dAll)+'</td><td class="num" style="color:var(--green);font-weight:600">'+fmt(dSet)+'</td><td class="num" style="color:var(--accent);font-weight:600">'+fmt(dExp)+'</td><td class="num">'+fmt(dIne)+'</td></tr>';
  });
  html += '</tbody></table><div class="pager" id="pagerReportDays"></div></div>';

  document.getElementById('content').innerHTML = html;
  paginateTable('tblReportKol', 'pagerReportKol', 10);
  paginateTable('tblReportProd', 'pagerReportProd', 10);
  paginateTable('tblReportDays', 'pagerReportDays', 10);
  paginateTable('tblKolWeek', 'pagerKolWeek', 10);
  paginateTable('tblProdWeek', 'pagerProdWeek', 10);
  paginateTable('tblKolMonth', 'pagerKolMonth', 10);
  paginateTable('tblProdMonth', 'pagerProdMonth', 10);

  // Wire up date pickers for section 2 (cả 2 khoảng độc lập)
  const rptCurFromEl = document.getElementById('rptCurFrom');
  const rptCurToEl = document.getElementById('rptCurTo');
  const rptCmpFromEl = document.getElementById('rptCmpFrom');
  const rptCmpToEl = document.getElementById('rptCmpTo');
  const rptCmpResetEl = document.getElementById('rptCmpReset');
  if(rptCurFromEl){
    rptCurFromEl.onchange = () => { state.reportCurFrom = rptCurFromEl.value; renderReport(); };
    rptCurToEl.onchange = () => { state.reportCurTo = rptCurToEl.value; renderReport(); };
  }
  if(rptCmpFromEl){
    rptCmpFromEl.onchange = () => { state.reportCmpFrom = rptCmpFromEl.value; renderReport(); };
    rptCmpToEl.onchange = () => { state.reportCmpTo = rptCmpToEl.value; renderReport(); };
    rptCmpResetEl.onclick = () => {
      state.reportCmpFrom = state.reportCurFrom ? shiftMonth(state.reportCurFrom, 1) : null;
      state.reportCmpTo = state.reportCurTo ? shiftMonth(state.reportCurTo, 1) : null;
      renderReport();
    };
  }

  mkChart('cReport','report',{
    type:'bar',
    data:{
      labels:['💰 DS Tổng (KĐK)','✅ DS Quyết toán','🔮 DS Dự kiến'],
      datasets:[{
        label:'Doanh số (đ)',
        data:[totalAll, totalSettled, totalExpected],
        backgroundColor:['#b8860b','#5a8a3a','#1B74C4'],
        borderRadius:8
      }]
    },
    options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>fmt(c.parsed.y)+'đ'}}},
      scales:{y:{ticks:{callback:v=>fmtK(v)}}}}
  });

  if(state.dateFrom && state.dateTo){
    const N2 = ndaysR(state.dateFrom, state.dateTo);
    const p1F = dshiftR(state.dateFrom, -N2), p1T = dshiftR(state.dateFrom, -1);
    const p2F = dshiftR(state.dateFrom, -2*N2), p2T = dshiftR(state.dateFrom, -N2-1);
    const c1 = calc3(state.dateFrom, state.dateTo);
    const c2 = calc3(p1F, p1T);
    const c3 = calc3(p2F, p2T);
    mkChart('cReportWeek','reportWeek',{
      type:'bar',
      data:{
        labels:['前上期','上期','本期'],
        datasets:[
          {label:'💰 DS Tổng', data:[c3.all,c2.all,c1.all], backgroundColor:'#b8860b', borderRadius:6},
          {label:'✅ DS Quyết toán', data:[c3.settled,c2.settled,c1.settled], backgroundColor:'#5a8a3a', borderRadius:6},
          {label:'🔮 DS Dự kiến', data:[c3.expected,c2.expected,c1.expected], backgroundColor:'#1B74C4', borderRadius:6},
        ]
      },
      options:{responsive:true,maintainAspectRatio:false,
        plugins:{legend:{position:'top'},tooltip:{callbacks:{label:c=>c.dataset.label+': '+fmt(c.parsed.y)+'đ'}}},
        scales:{y:{ticks:{callback:v=>fmtK(v)}}}}
    });

  }
  // Chart section 2 dùng dates ĐỘC LẬP
  if(state.reportCurFrom && state.reportCurTo && state.reportCmpFrom && state.reportCmpTo){
    const curF2 = state.reportCurFrom, curT2 = state.reportCurTo;
    const mmF = state.reportCmpFrom, mmT = state.reportCmpTo;
    const cCur = calc3(curF2, curT2);
    const cM = calc3(mmF, mmT);
    mkChart('cReportMonth','reportMonth',{
      type:'bar',
      data:{
        labels:['💰 DS Tổng','✅ DS Quyết toán','🔮 DS Dự kiến'],
        datasets:[
          {label:'Kỳ đối chiếu ('+mmF+'→'+mmT+')', data:[cM.all,cM.settled,cM.expected], backgroundColor:'#5b9bd5', borderRadius:6},
          {label:'Kỳ này ('+curF2+'→'+curT2+')', data:[cCur.all,cCur.settled,cCur.expected], backgroundColor:'#0E4D8B', borderRadius:6},
        ]
      },
      options:{responsive:true,maintainAspectRatio:false,
        plugins:{legend:{position:'top'},tooltip:{callbacks:{label:c=>c.dataset.label+': '+fmt(c.parsed.y)+'đ'}}},
        scales:{y:{ticks:{callback:v=>fmtK(v)}}}}
    });
  }
}

function render(){
  state.dateFrom = document.getElementById('dateFrom').value || null;
  state.dateTo = document.getElementById('dateTo').value || null;
  Object.keys(state.charts).forEach(destroyChart);
  if(state.tab==='overview') renderOverview();
  else if(state.tab==='lookup') renderLookup();
  else if(state.tab==='kols') renderKols();
  else if(state.tab==='month') renderMonth(state.selectedMonth);
  else if(state.tab==='report') renderReport();
  else if(state.tab.startsWith('m')) renderMonth(parseInt(state.tab.slice(1)));
}

document.getElementById('dateFrom').addEventListener('change', render);
document.getElementById('dateTo').addEventListener('change', render);

buildTabs();
buildStatusPills();
initDateRange();
render();
</script>
</body>
</html>
